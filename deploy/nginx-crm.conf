# Se agrega dentro del server { } de crm.peptique.com.mx que crea CloudPanel como "reverse proxy"
# hacia http://127.0.0.1:3200. Sube el límite de archivos (COA y protocolos de hasta 10 MB) y deja
# pasar solo las ligas firmadas de Supabase; el resto de Supabase no se publica.
client_max_body_size 12m;

location ^~ /storage/v1/object/sign/ {
  limit_except GET HEAD { deny all; }
  proxy_pass http://127.0.0.1:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
