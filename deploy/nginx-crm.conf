# Se agrega dentro del server { } de crm.peptique.com.mx que crea CloudPanel como "reverse proxy"
# hacia http://127.0.0.1:3200. Sube el límite de archivos (COA y protocolos de hasta 10 MB) y deja
# pasar solo las ligas firmadas de Supabase; el resto de Supabase no se publica.
client_max_body_size 12m;

location ^~ /storage/v1/object/sign/ {
  limit_except GET HEAD { deny all; }
  proxy_pass http://127.0.0.1:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Conector de Claude (MCP): solo los endpoints OAuth 2.1 de Supabase Auth (registro del cliente,
# autorizar y canjear el token). Requiere la ruta abierta /auth/v1/oauth/ en el gateway (ver
# CONECTOR-CLAUDE.md). /mcp y /.well-known/* los atiende el CRM (proxy general hacia 3200).
location ^~ /auth/v1/oauth/ {
  limit_except GET POST { deny all; }
  proxy_pass http://127.0.0.1:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location ^~ /auth/v1/oauth/authorizations/ { deny all; } # la pantalla de consentimiento usa la red interna
